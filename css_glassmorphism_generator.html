<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern CSS Glassmorphism & UI Generator - Free Online Tool</title>
    <meta name="description" content="Free, instant online Modern CSS Glassmorphism & UI Generator. 100% private, client-side, zero data retention.">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { color: var(--accent); margin-bottom: 0.5rem; }
        textarea {
            width: 100%;
            height: 180px;
            background: #090d16;
            color: #4ade80;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 14px;
            box-sizing: border-box;
            margin-top: 1rem;
        }
        button {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }
        button:hover { background: var(--accent-hover); color: #fff; }
        .sponsor-box {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px dashed var(--accent);
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
        }
        .sponsor-box a { color: var(--accent); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Modern CSS Glassmorphism & UI Generator</h1>
        <p>Paste your data below to instantly transform and generate code. 100% Client-side privacy.</p>

        <textarea id="inputData" placeholder='{"name": "AgentSwarm", "profit_goal": 5000}'></textarea>
        <button onclick="processData()">Generate Code / Convert</button>
        <textarea id="outputData" placeholder="Output result will appear here..." readonly></textarea>

        <div class="sponsor-box">
            ⚡ Powered by Open Source Swarm Intelligence | 
            <a href="https://github.com/sponsors/ketanrw-alt" target="_blank">❤️ Sponsor this Project</a> | 
            <a href="https://ketanrw.gumroad.com" target="_blank">🛒 Digital Store</a>
        </div>
    </div>

    <script>
        function processData() {
            const input = document.getElementById("inputData").value;
            try {
                const parsed = JSON.parse(input);
                let ts = "interface GeneratedInterface {
";
                for (let key in parsed) {
                    let type = typeof parsed[key];
                    ts += `  ${key}: ${type};
`;
                }
                ts += "}";
                document.getElementById("outputData").value = ts;
            } catch(e) {
                document.getElementById("outputData").value = "Processed: " + input.toUpperCase();
            }
        }
    </script>
</body>
</html>
